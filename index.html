<style>
:root{--p:#4c1d95;--p2:#7c3aed;--hd:#2e1065;--g:#a855f7;--g2:#e3c984;--bg:#eef3f2;--card:#fff;--cr:255,255,255;--t:#1e1038;--m:#667b7b;--b:#e1e9e7;--b2:#cdd9d6;--soft:#f6faf9;--hov:#e8f1ef;--pt:var(--p);--r:#c4443a;--o:#d4832a;--ok:#1f8a5b;--y:#9a7420;--rbg:#fbeceb;--obg:#fcf0dc;--okbg:#e3f3ec;--gbg:#f4e8c8;--gbt:#6d5112;--track:#dfe9e7;
--sh:0 1px 2px rgba(14,71,72,.05),0 12px 30px -16px rgba(14,71,72,.28);--rc:20px;--rs:12px;--f:'IBM Plex Sans Arabic',Tahoma,sans-serif;--fd:Amiri,'IBM Plex Sans Arabic',serif}
html[data-dk="1"]{color-scheme:dark;--bg:#0c1416;--card:#142124;--cr:20,33,36;--t:#e5eeed;--m:#8ea6a6;--b:#1e2f32;--b2:#2c4145;--soft:#192a2d;--hov:#1d3235;--track:#243a3d;--pt:color-mix(in srgb,var(--p2) 45%,#fff);--r:#f0776c;--o:#eba04b;--ok:#46c98f;--y:#dcb862;--rbg:#3b1d1b;--obg:#3a2a12;--okbg:#10372a;--gbg:#3a3118;--gbt:#ecd592;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:15px/1.65 var(--f);color:var(--t);-webkit-font-smoothing:antialiased;background:radial-gradient(900px 380px at 88% -120px,color-mix(in srgb,var(--p2) 18%,transparent),transparent),var(--bg)}
[hidden]{display:none!important}
button{font-family:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
/* shell */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px 16px;color:#fff;background:linear-gradient(175deg,var(--hd),var(--p) 70%,var(--p2))}
.br{display:flex;align-items:center;gap:12px;padding:0 8px 20px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14)}
.emb{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--hd);background:linear-gradient(135deg,var(--g2),var(--g));box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}.emb .ic{width:26px;height:26px}
.br b{display:block;font:700 21px/1.2 var(--fd)}.br small{display:block;font-size:12px;opacity:.75}
.sb a.nl{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:var(--rs);color:rgba(255,255,255,.78);font-weight:600;font-size:14.5px;transition:background .2s,color .2s}
.sb a.nl:hover{background:rgba(255,255,255,.09);color:#fff}
.sb a.nl.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--g2)}
.sb a.nl b{margin-inline-start:auto;min-width:22px;height:22px;border-radius:11px;background:var(--r);color:#fff;font:600 11.5px/22px var(--f);text-align:center}
.sp{flex:1}
.meb{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--rs);background:rgba(255,255,255,.09);cursor:pointer}
.meb .av{width:40px;height:40px;font-size:19px;background:rgba(255,255,255,.16);color:var(--g2)}.meb div{min-width:0;flex:1}.meb b{display:block;font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meb small{opacity:.7;font-size:12px}
.mn{min-width:0}
.tp{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:64px;padding:0 max(16px,calc((100% - 1120px)/2 + 16px));background:rgba(var(--cr),.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
.tp h1{margin:0;flex:1;font:700 22px var(--fd);color:var(--pt)}
.tpa{display:flex;gap:8px;align-items:center;position:relative}
.srch{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border:1px solid var(--b2);border-radius:var(--rs);background:var(--card);color:var(--m);font:500 13.5px var(--f);cursor:pointer;min-width:220px}
.srch:hover{border-color:var(--p2)}.srch kbd{margin-inline-start:auto;font:600 11px var(--f);padding:1px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--b)}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--b2);border-radius:var(--rs);background:var(--card);color:var(--t);cursor:pointer;transition:background .2s}.ib:hover{background:var(--hov)}
.ib b{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--r);color:#fff;font:600 11px/19px var(--f);text-align:center;box-shadow:0 0 0 2px var(--card)}.ib b:empty{display:none}
main{max-width:1152px;margin:auto;padding:22px 16px 60px}
.vi{animation:vin .4s cubic-bezier(.2,.8,.2,1)}
.bn{display:none}
/* cards */
.cd{background:var(--card);border-radius:var(--rc);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.cd>h3,.ch3{margin:0 0 14px;font:700 19px var(--fd);color:var(--pt);display:flex;align-items:center;gap:10px}
.ch3 .ic{color:var(--g)}.ch3 a,.ch3 button{margin-inline-start:auto;font:600 12.5px var(--f);color:var(--p2);background:none;border:0;cursor:pointer}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 26px;margin-bottom:16px;border-radius:26px;color:#fff;background:linear-gradient(120deg,var(--hd),var(--p) 55%,var(--p2));box-shadow:0 22px 40px -22px color-mix(in srgb,var(--p) 80%,transparent)}
.hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;left:-70px;top:-130px;background:radial-gradient(circle,color-mix(in srgb,var(--g2) 38%,transparent),transparent 70%)}
.hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;left:150px;bottom:-110px;background:rgba(255,255,255,.07)}
.hero>div{position:relative;z-index:1}.hero>div:first-child{flex:1;min-width:230px}
.hd{margin:0 0 4px;font-size:13px;opacity:.8}.hero h2{margin:0;font:700 29px/1.35 var(--fd)}.hs{margin:6px 0 0;opacity:.88;font-size:14.5px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kc{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--rc);background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:transform .2s}
.kc:hover{transform:translateY(-3px)}
.kc i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--kc,var(--p2));background:color-mix(in srgb,var(--kc,var(--p2)) 13%,var(--card))}.kc i .ic{width:23px;height:23px}
.kc b{display:block;font:700 32px/1 var(--fd);color:var(--t)}.kc span{color:var(--m);font-size:12.8px}
/* buttons / chips / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;height:42px;padding:0 18px;border-radius:var(--rs);background:var(--p);color:#fff;font:600 14px var(--f);cursor:pointer;position:relative;transition:filter .2s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn .ic{width:17px;height:17px}

 else if(/requires-recent-login/i.test(c))m='سجّل الدخول من جديد ثم أعد المحاولة';
 else if(/permission.denied/i.test(c))m='غير مسموح — قد تكون الصلاحية أُغلقت من الإدارة أو الباحث ليس ضمن باحثيك';

const nk=()=>push(ref(db,'_k')).key,sv=()=>serverTimestamp();
const clean=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
const cleanCode=c=>String(c==null?'':c).replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF\u00A0]/g,' ').trim();
const genForm=c=>/^[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}$/i.test(c);
const arr=x=>{if(Array.isArray(x))return x;try{const v=JSON.parse(x);return Array.isArray(v)?v:[]}catch(e){return[]}};
const cairo=(ms=Date.now()+OFF)=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)),g=t=>p.find(x=>x.type==t).value;return{d:g('year')+'-'+g('month')+'-'+g('day'),t:g('year')+'-'+g('month')+'-'+g('day')+' '+g('hour')+':'+g('minute')}};
async function sha256Hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const supHash=async nid=>(await sha256Hex(PEPPER+nid)).slice(0,24),supEmail=(h,v)=>h+'_v'+v+'@'+DOMAIN;
function stripLog(type,d){d=d||{};if(type==='report')return{from:d.from,to:d.to,pct:d.pct,rate:d.rate,rec:d.rec,done:d.done,obst:d.obst,plan:d.plan};if(type==='task')return{done:!!d.done,due:d.due};if(type==='meeting')return{next:d.next,mode:d.mode};return{}}
const withTimeout=(p,ms=25000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(mkErr(NET)),ms))]);

/* ===== إدارة الاتصال: يفتح أثناء العملية ويُغلق بعدها ===== */
let ON=0,offT=null;
async function online(fn){clearTimeout(offT);if(ON++===0)goOnline(db);try{return await fn()}finally{if(--ON===0)offT=setTimeout(()=>{if(ON===0)goOffline(db)},1500)}}

/* ===== الحالة ===== */
let CUR=null; /* {sid,nid,perms,rids:Set,logs:{id:{rid,created}}} */
const waitUser=()=>new Promise(res=>{const un=onAuthStateChanged(auth,u=>{un();res(u)})});
const need=()=>{if(!auth.currentUser||!CUR)throw mkErr('انتهت الجلسة — بيانات الدخول غير صحيحة، سجّل الدخول من جديد')};

async function resume(){const u=await waitUser();return!!u}
async function logout(){try{await signOut(auth)}catch(e){}CUR=null}
async function login(d){const n=clean(d.nid),code=cleanCode(d.code);if(n.length!==14||code.length<6)throw mkErr(BAD);
 const h=await supHash(n),ver=(await withTimeout(online(()=>get(ref(db,'loginmap/'+h))))).val();if(!ver)throw mkErr(BAD);
 await setPersistence(auth,d.remember?browserLocalPersistence:browserSessionPersistence);
 const em=supEmail(h,ver),norm=genForm(code)?code.replace(/[^A-Za-z0-9]/g,'').toUpperCase().replace(/^(.{4})(.{4})$/,'$1-$2'):null,tries=[code];if(norm&&norm!==code)tries.push(norm);
 let ok=false;for(const c of tries){try{await signInWithEmailAndPassword(auth,em,c);ok=true;break}catch(e){if(!/invalid-credential|wrong-password|user-not-found/.test(String(e&&e.code)))throw e}}
 if(!ok)throw mkErr(BAD);
 try{return await supAll()}catch(e){try{await signOut(auth)}catch(x){}throw e}}

/* ===== sup_all ===== */
async function supAll(){const u=auth.currentUser;if(!u)throw mkErr('انتهت الجلسة — بيانات الدخول غير صحيحة، سجّل الدخول من جديد');
 return withTimeout(online(async()=>{
  const sid=(await get(ref(db,'uids/'+u.uid))).val();if(!sid){await signOut(auth);throw mkErr('بيانات الدخول غير صحيحة — هذا الحساب لم يعد مرتبطاً بمشرف')}
  const me=(await get(ref(db,'supervisors/'+sid))).val();if(!me){await signOut(auth);throw mkErr('بيانات الدخول غير صحيحة')}
  if(me.active!==true)throw mkErr('تم إيقاف حسابك — تواصل مع إدارة الدراسات العليا');
  const[links,pub,tp,rq]=await Promise.all([get(ref(db,'sup_researchers/'+sid)),get(ref(db,'public/settings')),get(ref(db,'public/templates')),get(query(ref(db,'requests'),orderByChild('sid'),equalTo(sid)))]);
  const st=pub.val()||{},perms={};PERMS.forEach(k=>perms[k]=st['pm_'+k]!==false);
  const ids=Object.keys(links.val()||{});
  const[pubs,coms,logs]=await Promise.all([Promise.all(ids.map(id=>get(ref(db,'researchers_pub/'+id)))),perms.committee?Promise.all(ids.map(id=>get(ref(db,'researchers_com/'+id)).catch(()=>null))):Promise.resolve([]),Promise.all(ids.map(id=>get(query(ref(db,'logs/'+id),orderByChild('sid'),equalTo(sid)))))]);
  const researchers=[],rset=new Set(),lg=[],lmap={};
  ids.forEach((id,i)=>{const p=pubs[i].val();if(!p)return;rset.add(id);const o={id};PUBK.forEach(k=>o[k]=p[k]==null?'':p[k]);o.supervisors=arr(p.supervisors);o.committee=perms.committee&&coms[i]?arr(coms[i].val()):[];researchers.push(o);
   logs[i].forEach(c=>{const v=c.val();lg.push({id:c.key,rid:id,sid:v.sid,type:v.type,date:v.date,data:v.data||'{}',created:v.created||''});lmap[c.key]={rid:id,created:v.created||''}})});
  const requests=[];rq.forEach(c=>{const v=c.val();requests.push({id:c.key,rid:v.rid,sid:v.sid,type:v.type,date:v.date||'',data:v.data||'{}',status:v.status||'pending',adminNote:v.adminNote||'',created:v.created||'',decided:v.decided||''})});
  CUR={sid,nid:me.nid||'',perms,rids:rset,logs:lmap};
  const T=cairo();if(String(me.lastLogin||'').slice(0,10)!==T.d)await update(ref(db),{['supervisors/'+sid+'/lastLogin']:T.t}).catch(()=>{});
  const pubS={};['faculty','univ','alertDays','vd','vdPhone','dean','vp'].forEach(k=>pubS[k]=st[k]==null?'':String(st[k]));if(!pubS.vd)pubS.vd='أ.د/ هناء فؤاد';const tpls=[];tp.forEach(c=>{const v=c.val()||{};tpls.push({id:c.key,k:v.k,to:v.to,t:v.t,b:v.b,o:+v.o||0})});tpls.sort((a,b)=>a.o-b.o);
  return{sup:{id:sid,name:me.name||'',job:me.job||'',phone:me.phone||''},settings:pubS,perms,researchers,logs:lg,requests,tpls}}))}

/* ===== السجلات ===== */
async function supLog(b){need();const w=b.row||{};
 if(!CUR.perms.log)throw mkErr('تسجيل السجلات غير متاح حالياً');if(!CUR.rids.has(w.rid))throw mkErr('هذا الباحث ليس ضمن باحثيك');
 if(LOG_TYPES.indexOf(w.type)<0)throw mkErr('نوع غير معروف');const data=w.data||{};if(JSON.stringify(data).length>20000)throw mkErr('النص طويل جداً');
 let old=null;if(w.id){old=CUR.logs[w.id];if(!old||old.rid!==w.rid)throw mkErr('غير مسموح')}
 const lid=w.id||nk(),T=cairo().d,date=String(w.date||'').slice(0,10),created=old&&old.created?old.created:T,sid=CUR.sid,upd={};
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw mkErr('تاريخ غير صالح');
 const ds=JSON.stringify(data);
 upd['logs/'+w.rid+'/'+lid]={sid,type:w.type,date,data:ds,created};
 upd['logs_adm/'+lid]={rid:w.rid,sid,type:w.type,date,data:JSON.stringify(stripLog(w.type,data)),u:sv()};
 upd['activity/'+nk()]={rid:w.rid,sid,kind:'log',t:sv()};
 await online(()=>update(ref(db),upd));CUR.logs[lid]={rid:w.rid,created};
 return{row:{id:lid,rid:w.rid,sid,type:w.type,date,data:ds,created}}}
async function supLogDel(b){need();const old=CUR.logs[b.id];if(!old)throw mkErr('غير مسموح');if(!CUR.perms.log)throw mkErr('تسجيل السجلات غير متاح حالياً');const sid=CUR.sid,upd={};
 upd['logs/'+old.rid+'/'+b.id]=null;upd['logs_adm/'+b.id]={del:true,rid:old.rid,sid,u:sv()};upd['activity/'+nk()]={rid:old.rid,sid,kind:'log',t:sv()};
 await online(()=>update(ref(db),upd));delete CUR.logs[b.id];return{done:true}}

/* ===== الطلبات ===== */
const ownReqs=async sid=>{const s=await get(query(ref(db,'requests'),orderByChild('sid'),equalTo(sid))),o=[];s.forEach(c=>{o.push({id:c.key,...c.val()})});return o};
async function supReq(b){need();const w=b.row||{},d=w.data||{};
 if(REQ_TYPES.indexOf(w.type)<0)throw mkErr('نوع الطلب غير معروف');if(!CUR.perms['req_'+w.type])throw mkErr('هذا النوع من الطلبات غير متاح لك حالياً');
 if(!CUR.rids.has(w.rid))throw mkErr('هذا الباحث ليس ضمن باحثيك');if(JSON.stringify(d).length>5000)throw mkErr('النص طويل جداً');

  await update(ref(db),{['requests/'+b.id]:null,['activity/'+nk()]:{rid:q.rid,sid,kind:'request',t:sv()}});return{done:true}})}

 if(n.length<6)throw mkErr('كلمة السر يجب ألا تقل عن 6 خانات');if(n.length>40)throw mkErr('كلمة السر طويلة جداً');if(clean(n)===CUR.nid)throw mkErr('لا تستخدم الرقم القومي ككلمة سر');

 catch(e){if(/wrong-password|invalid-credential/.test(String(e&&e.code)))throw mkErr('كلمة السر الحالية غير صحيحة');if(/weak-password/.test(String(e&&e.code)))throw mkErr('كلمة السر ضعيفة');throw e}return{}}

  case'sup_login':r=await login(d);break;
  case'sup_all':r=await supAll();break;
  case'sup_log':r=await supLog(d);break;
  case'sup_logdel':r=await supLogDel(d);break;

    case'sup_warns':r=await supWarns(d);break;

const G=window.GSX={host:null,_t:null};

/* ---------- المتغيّرات المعروفة ---------- */
const TOK={
 g:[['الباحث','اسم الباحث'],['الدرجة','الدرجة العلمية'],['القسم','القسم'],['التخصص','التخصص'],['المشرف','اسم المشرف'],['المشرفون','كل مشرفي الباحث'],['وكيل_الكلية','وكيل الكلية'],['الكلية','اسم الكلية'],['الجامعة','اسم الجامعة'],['اليوم','تاريخ اليوم']],
 w:[['رقم_الإنذار','رقم الإنذار (5/2026)'],['تاريخ_الإنذار','تاريخ الإنذار'],['سبب_الإنذار','سبب الإنذار'],['ترتيب_الإنذار','الإنذار الثاني…'],['مصدر_الإنذار','من وجّه الإنذار']],
 r:[['قائمة_المواعيد','كل المواعيد'],['الموعد','أول موعد'],['تاريخ_الموعد','تاريخه'],['المتبقي','المدة المتبقية'],['عدد_المواعيد','العدد']]};
const KN=new Set([].concat(TOK.g,TOK.w,TOK.r).map(x=>x[0]));
G.TOK=TOK;
const nm=n=>String(n).trim().replace(/\s+/g,'_');

/* ---------- النماذج الافتراضية ---------- */
const DEF=[
{id:'d_wr',k:'warn',to:'r',t:'إنذار للباحث — رسمي',b:'السلام عليكم ورحمة الله وبركاته\nالباحث/ة: {الباحث}\nالدرجة: {الدرجة} — القسم: {القسم}\n\n⚠️ إنذار رقم ({رقم_الإنذار}) بتاريخ {تاريخ_الإنذار}\n({ترتيب_الإنذار})\n\nالسبب: {سبب_الإنذار}\n\nيُرجى سرعة التواصل مع المشرف وتدارك الموقف في أقرب وقت، وإلا سيُتخذ الإجراء اللائحي المناسب.\n\n{الكلية} — {الجامعة}'},
{id:'d_wr2',k:'warn',to:'r',t:'إنذار للباحث — بمهلة محددة',b:'السلام عليكم ورحمة الله وبركاته\nالباحث/ة: {الباحث}\n\n⚠️ إنذار رقم ({رقم_الإنذار}) بتاريخ {تاريخ_الإنذار}\nالسبب: {سبب_الإنذار}\n\nأمامك مهلة {المهلة_بالأيام} يوماً من تاريخ هذا الإنذار لاستكمال المطلوب.\n\n{الكلية} — {الجامعة}'},
{id:'d_wv',k:'warn',to:'v',t:'إخطار وكيل الكلية بإنذار',b:'سيادة {وكيل_الكلية}\nوكيل الكلية للدراسات العليا\nتحية طيبة وبعد،\n\nنفيد سيادتكم بأن {مصدر_الإنذار} وجّه إنذاراً للباحث/ة: {الباحث} ({الدرجة} — {القسم}):\n• رقم الإنذار: {رقم_الإنذار}\n• التاريخ: {تاريخ_الإنذار} ({ترتيب_الإنذار})\n• السبب: {سبب_الإنذار}\n\nوتفضلوا بقبول فائق الاحترام.'},
{id:'d_rr',k:'remind',to:'r',t:'تذكير للباحث بالمواعيد',b:'السلام عليكم ورحمة الله وبركاته\nالباحث/ة: {الباحث}\n\n🔔 تذكير من إدارة الدراسات العليا — كلية {الكلية}:\n{قائمة_المواعيد}\n\nبرجاء المبادرة بالإجراءات اللازمة قبل انتهاء الموعد. شاكرين تعاونكم.'},
{id:'d_rs',k:'remind',to:'s',t:'تذكير للمشرف بمواعيد باحثيه',b:'السلام عليكم ورحمة الله وبركاته\nسيادة {المشرف}\n\n🔔 تذكير من إدارة الدراسات العليا — كلية {الكلية}:\nمواعيد الباحثين التالين قاربت على الانتهاء:\n{قائمة_المواعيد}\n\nبرجاء متابعة الباحثين ومساعدتهم على استيفاء المطلوب في الوقت المناسب. شاكرين تعاونكم.'},
{id:'d_rv',k:'remind',to:'v',t:'ملخص المواعيد لوكيل الكلية',b:'سيادة {وكيل_الكلية}\nتحية طيبة وبعد،\n\n🔔 ملخص المواعيد القريبة والمتأخرة للباحثين ({عدد_المواعيد} موعد):\n{قائمة_المواعيد}\n\nوتفضلوا بقبول فائق الاحترام.'},
{id:'d_x1',k:'reason',to:'r',t:'عدم الالتزام بالمقابلات الإشرافية',b:'عدم الالتزام بالمقابلات الإشرافية'},
{id:'d_x2',k:'reason',to:'r',t:'التأخر في تسليم المهام',b:'التأخر في تسليم المهام المطلوبة'},
{id:'d_x3',k:'reason',to:'r',t:'عدم تقديم التقرير الدوري',b:'عدم تقديم ما يلزم لإعداد التقرير الدوري'},
{id:'d_x4',k:'reason',to:'r',t:'الانقطاع عن المتابعة',b:'الانقطاع عن المتابعة والتواصل مع المشرف'}];
G.defaults=()=>DEF.map(x=>({...x}));
G.setTpls=a=>{G._t=Array.isArray(a)&&a.length?a.map(x=>({id:x.id,k:x.k||'warn',to:x.to||'r',t:x.t||'',b:x.b||''})):null};
G.all=()=>G._t||G.defaults();
G.list=(k,to)=>G.all().filter(t=>t.k===k&&(!to||t.to===to));
G.byId=id=>G.all().find(t=>t.id===id);

/* ---------- المحرّك ---------- */
G.render=(b,c)=>String(b||'').replace(/\{([^{}\n]{1,40})\}/g,(m,n)=>{n=nm(n);if(!(n in c))return m;const v=c[n];return v==null?'':v});
G.fields=b=>{const o=[];String(b||'').replace(/\{([^{}\n]{1,40})\}/g,(m,n)=>{n=nm(n);if(!KN.has(n)&&!o.includes(n))o.push(n);return m});return o};
G.ord=n=>'الإنذار '+(['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||('رقم '+n));
G.lbl=k=>k<0?'متأخر '+(-k)+' يوم':k==0?'اليوم':'بعد '+k+' يوم';
G.wa=(phone,text)=>{let n=String(phone||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);
 if(/^0\d{10}$/.test(n))n='2'+n;else if(/^1\d{9}$/.test(n))n='20'+n;
 const t=text?'?text='+encodeURIComponent(text):'';return n.length>=9?'https://wa.me/'+n+t:'https://wa.me/'+t};
G.ctx=o=>{const r=o.r||{},w=o.w||{},ss=(o.sups||[]).map(s=>s.n||s).filter(Boolean),dl=(o.dues||[]).slice().sort((a,b)=>a.k-b.k),f=dl[0]||{};
 const c={الباحث:r.name||'',الدرجة:r.degree||'',القسم:r.dept||'',التخصص:r.specialty||'',المشرف:o.sup||ss.join(' و '),المشرفون:ss.join(' ، '),وكيل_الكلية:o.vd||'',الكلية:o.faculty||'',الجامعة:o.univ||'',اليوم:fdt(G.host&&G.host.today?G.host.today():''),
  رقم_الإنذار:w.no?w.no+'/'+w.yr:'(يُحدَّد عند الإصدار)',تاريخ_الإنذار:fdt(w.date),سبب_الإنذار:w.reason||'',ترتيب_الإنذار:w.ord?G.ord(w.ord):'',مصدر_الإنذار:w.src||o.sup||'إدارة الدراسات العليا',
  قائمة_المواعيد:dl.map(a=>'• '+(o.names?a.n+' — ':'')+a.t.replace(/\s*\(.*$/,'')+' — '+fdt(a.d)+' ('+G.lbl(a.k)+')').join('\n'),الموعد:f.t?f.t.replace(/\s*\(.*$/,''):'',تاريخ_الموعد:fdt(f.d),المتبقي:f.d?G.lbl(f.k):'',عدد_المواعيد:dl.length};
 const x=o.x||{};for(const k in x)if(x[k]!==''&&x[k]!=null)c[nm(k)]=x[k];return c};
G.sample=()=>G.ctx({r:{name:'محمد أحمد علي',degree:'ماجستير',dept:'العلوم النفسية',specialty:'صحة نفسية'},sups:['أ.د/ سامية محمود'],sup:'أ.د/ سامية محمود',vd:'أ.د/ هناء فؤاد',faculty:'التربية للطفولة المبكرة',univ:'جامعة بني سويف',w:{no:5,yr:2026,date:'2026-11-14',reason:'عدم الالتزام بالمقابلات الإشرافية',ord:2},names:true,dues:[{n:'محمد أحمد علي',t:'انتهاء القيد',d:'2026-12-01',k:17},{n:'محمد أحمد علي',t:'تقرير الإشراف الدوري',d:'2026-11-10',k:-4}]});

/* ---------- معالج الإرسال بالتتابع (واتساب) ---------- */
G.queue=function(o){const H=G.host,items=o.items.map(x=>({...x,sent:false}));let cur=0;
 const nxt=()=>{const i=items.findIndex((x,j)=>!x.sent&&j!==cur);return i<0?items.findIndex(x=>!x.sent):i};
 const draw=()=>{const box=q('#gxq');if(!box)return;const it=items[cur],left=items.filter(x=>!x.sent).length;
  if(!left){box.innerHTML=`<div class=gx-done><b>✅ تم تجهيز وإرسال كل الرسائل (${items.length})</b><button class="btn" onclick="GSX.host.hide()">إغلاق</button></div>`;o.onDone&&o.onDone();return}
  box.innerHTML=`<div class=gx-steps>${items.map((x,i)=>`<button type=button data-i="${i}" class="gx-st ${i==cur?'on':''} ${x.sent?'ok':''}"><i>${x.sent?'✓':i+1}</i><span>${E(x.role)}</span></button>`).join('')}</div>
<div class=gx-to><div><b>${E(it.name||'—')}</b><span class=gx-role>${E(it.role)}</span></div><small>${it.phone?'<bdi>'+E(it.phone)+'</bdi>':'⚠ لا يوجد رقم محفوظ — سيفتح واتساب لتختار جهة الاتصال بنفسك'}</small></div>
<textarea id=gxqt rows=11 spellcheck=false>${E(it.text)}</textarea>
<div class=gx-act><a class=btn id=gxqs target=_blank rel=noopener href="${E(G.wa(it.phone,it.text))}">${icn('wa')}${it.sent?'إعادة الإرسال':'إرسال عبر واتساب'}</a><button type=button class="btn w" id=gxqc>نسخ النص</button>${items.length>1?'<button type=button class="btn w" id=gxqn>التالي ◂</button>':''}</div>
<p class=gx-hint>يمكنك تعديل النص قبل الإرسال. بعد الضغط على «إرسال» يفتح واتساب والرسالة جاهزة — اضغط إرسال هناك ثم ارجع هنا، وسننتقل تلقائياً للرسالة التالية (${left} متبقية).</p>`;
  const t=q('#gxqt'),a=q('#gxqs');t.oninput=()=>{it.text=t.value;a.href=G.wa(it.phone,it.text)};
  a.onclick=()=>{it.sent=true;o.onSent&&o.onSent(it);setTimeout(()=>{const n=nxt();if(n>=0)cur=n;draw()},500)};
  q('#gxqc').onclick=function(){const b=this;(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{b.textContent='تم النسخ ✓'},()=>{t.select();document.execCommand&&document.execCommand('copy');b.textContent='تم النسخ ✓'});setTimeout(()=>{b.textContent='نسخ النص'},1500)};
  const n=q('#gxqn');n&&(n.onclick=()=>{cur=(cur+1)%items.length;draw()});
  box.querySelectorAll('.gx-st').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()})};
 H.show(o.title||'إرسال عبر واتساب',o.sub||'',`<div id=gxq class=gx></div>`,'');draw()};

/* ---------- بطاقة إنذار ---------- */
G.wcard=(w,o)=>{o=o||{};const s=w.sent||{},ch=(k,t)=>s[k]?`<span class="chip">${t} ✓ ${E(String(s[k]).slice(5,16))}</span>`:`<span class="chip p">${t}: لم يُرسل</span>`;
 return `<div class=gx-wc><div class=gx-wh><b>إنذار رقم ${w.no}/${w.yr}</b><span class="chip z">${E(G.ord(w.ord))}</span><span class=gx-d>${fdt(w.date)}</span></div>${o.head?`<div class=gx-wm>${o.head}</div>`:''}<p>${E(w.reason)}</p><div class=gx-ws>${ch('r','الباحث')}${ch('v','وكيل الكلية')}</div>${o.actions?`<div class=gx-wa>${o.actions}</div>`:''}</div>`};

/* ---------- نافذة الإنذار (إصدار جديد أو إعادة إرسال) ---------- */
G.warn=function(o){const H=G.host,r=o.r||{},rs=o.mode==='resend',W0=o.w||{},T=H.today();let XV={};try{XV=JSON.parse(W0.x||'{}')||{}}catch(e){}
 const rows=[{k:'r',role:'الباحث',name:r.name,phone:r.phone},{k:'v',role:'وكيل الكلية',name:o.vd||'وكيل الكلية',phone:o.vdPhone}];
 rows.forEach(x=>{x.l=G.list('warn',x.k)});
 const reasons=G.list('reason');
 const sel=()=>rows.map(x=>({...x,on:!!(q('#gxc_'+x.k)&&q('#gxc_'+x.k).checked),tpl:G.byId((q('#gxs_'+x.k)||{}).value)})).filter(x=>x.on&&x.tpl);
 const W=()=>rs?W0:{no:0,yr:0,date:(q('#gxw_d')||{}).value||T,reason:((q('#gxw_r')||{}).value||'').trim(),ord:(o.prior||[]).length+1};
 const cx=()=>G.ctx({r,sups:o.sups,sup:o.sup,vd:o.vd,faculty:o.faculty,univ:o.univ,w:{...W(),src:rs?(o.src||o.sup):o.sup},x:XV});
 const flds=()=>{const s=[];sel().forEach(x=>G.fields(x.tpl.b).forEach(n=>{if(!s.includes(n))s.push(n)}));return s};
 const drawX=()=>{const f=flds(),b=q('#gxw_x');if(!b)return;b.innerHTML=f.length?`<div class=gx-f><label>حقول إضافية يطلبها النموذج</label>${f.map(n=>`<input data-x="${E(n)}" placeholder="${E(n.replace(/_/g,' '))}" value="${E(XV[n]||'')}">`).join('')}</div>`:'';
  b.querySelectorAll('input').forEach(i=>i.oninput=()=>{XV[i.dataset.x]=i.value.trim();pv()})};
 const pv=()=>{const c=cx(),b=q('#gxw_pv');if(!b)return;const l=sel();b.innerHTML=l.length?l.map(x=>`<div class=gx-pv><b>معاينة — ${E(x.role)}</b><pre>${E(G.render(x.tpl.b,c))}</pre></div>`).join(''):'<div class=em>اختر مستلماً واحداً على الأقل</div>'};
 const body=`<div class=gx>${rs?`<div class=gx-num>إنذار رقم <b>${W0.no}/${W0.yr}</b> بتاريخ ${fdt(W0.date)} — ${E(G.ord(W0.ord))}<p>${E(W0.reason)}</p></div>`:`<div class=gx-row><div><label>تاريخ الإنذار</label><input type=date id=gxw_d value="${T}"></div><div><label>رقم الإنذار</label><input value="يُولَّد تلقائياً عند الإصدار" disabled></div></div>
<label>سبب الإنذار</label>${reasons.length?`<div class=gx-chips>${reasons.map(x=>`<button type=button data-b="${E(x.b)}">${E(x.t)}</button>`).join('')}</div>`:''}<textarea id=gxw_r rows=3 placeholder="اكتب سبب الإنذار بوضوح…"></textarea>${(o.prior||[]).length?`<p class=gx-hint>سبق توجيه ${(o.prior||[]).length} إنذار لهذا الباحث — هذا سيكون <b>${E(G.ord((o.prior||[]).length+1))}</b>.</p>`:''}`}
<label style="margin-top:14px">إرسال عبر واتساب إلى</label>
${rows.map(x=>`<div class=gx-rc><label class=gx-ck><input type=checkbox id=gxc_${x.k} ${x.l.length?'checked':'disabled'}><span>${x.role}: <b>${E(x.name||'—')}</b>${x.phone?'':' <small class=gx-w>(لا يوجد رقم — ستختار جهة الاتصال)</small>'}</span></label>${x.l.length?`<select id=gxs_${x.k}>${x.l.map(t=>`<option value="${E(t.id)}">${E(t.t)}</option>`).join('')}</select>`:'<small>لا يوجد نموذج — أضف من «النماذج»</small>'}</div>`).join('')}
<div id=gxw_x></div><div id=gxw_pv></div></div>`;
 H.show(rs?'إعادة إرسال إنذار':'توجيه إنذار',E(r.name||''),body,`<button class=btn id=gxw_go>${icn('wa')}${rs?'متابعة الإرسال':'إصدار الإنذار وإرساله'}</button><button class="btn w" onclick="GSX.host.hide()">إلغاء</button>`);
 const root=q('.gx');if(!root)return;
 root.addEventListener('input',pv);root.addEventListener('change',e=>{if(/^gx[cs]_/.test(e.target.id||'')){drawX();pv()}});
 root.querySelectorAll('.gx-chips button').forEach(b=>b.onclick=()=>{const t=q('#gxw_r');t.value=t.value.trim()?t.value.trim().replace(/[؛.]$/,'')+'؛ '+b.dataset.b:b.dataset.b;pv();t.focus()});
 drawX();pv();
 q('#gxw_go').onclick=async function(){const btn=this,l=sel(),w=W();
  if(!rs){if(!w.reason)return H.toast('اكتب سبب الإنذار');if(!/^\d{4}-\d{2}-\d{2}$/.test(w.date))return H.toast('تاريخ غير صالح')}
  if(!l.length)return H.toast('اختر مستلماً واحداً على الأقل');
  const miss=flds().find(n=>!XV[n]);if(miss)return H.toast('أكمل الحقل: '+miss.replace(/_/g,' '));
  let F=W0;if(!rs){btn.classList.add('ld');try{F=await o.save({reason:w.reason,date:w.date,x:XV})}catch(e){btn.classList.remove('ld');return H.toast(e.message||'تعذّر الإصدار')}btn.classList.remove('ld');F.src=o.sup;o.saved&&o.saved(F)}
  const c=G.ctx({r,sups:o.sups,sup:o.sup,vd:o.vd,faculty:o.faculty,univ:o.univ,w:{...F,src:rs?(o.src||o.sup):o.sup},x:XV});
  G.queue({title:'إرسال الإنذار',sub:'إنذار رقم '+F.no+'/'+F.yr+' — '+E(r.name||''),items:l.map(x=>({key:x.k,role:x.role,name:x.name,phone:x.phone,text:G.render(x.tpl.b,c)})),onSent:it=>o.sent&&o.sent(F,it.key)})}};
})();

</script>
<script>
/* ===== توجيه الإنذارات من بوابة المشرف ===== */
var WN={},TPLS=[];
GSX.host={today:()=>iso(today()),hide:()=>cl(),toast:m=>toast(m),
 show(title,sub,body,foot){ov(`<div class=sheet><div class=sh1 style="--kc:var(--r)"><i>${ic('warn')}</i><div><b>${title}</b><small>${sub||''}</small></div><button class=ib onclick=cl() aria-label="إغلاق">${ic('x')}</button></div><div class=shb>${body}</div>${foot?`<div class=sht>${foot}</div>`:''}</div>`)}};
function warnCard(id){if(WN[id]===undefined){WN[id]=null;api('sup_warns',{rid:id}).then(j=>{WN[id]=j.warnings||[];route(1)}).catch(()=>{WN[id]=[]})}
 const l=WN[id];
 return `<div class=cd><div class=ch3>${ic('warn')}الإنذارات${l&&l.length?`<b style="margin-inline-start:auto;font:700 20px var(--fd);color:var(--r)">${l.length}</b>`:''}</div>${l===null?`<div class=em>جارٍ التحميل…</div>`:l.length?l.map(w=>GSX.wcard(w,{head:w.sid==ME.id?'':'وجّهه أحد مشرفي الباحث',actions:w.sid==ME.id?`<button class="btn sm g" onclick="warnResend('${esc(id)}','${esc(w.id)}')">${ic('wa')}إعادة إرسال</button>`:''})).join(''):`<div class=em>${ic('check')}لا توجد إنذارات لهذا الباحث</div>`}</div>`}
function warnCtx(r){return{r,sups:r.supervisors,sup:ME.name,faculty:S.faculty,univ:S.univ,vd:S.vd,vdPhone:S.vdPhone}}
function warnSentFn(id){return(W,k)=>{api('sup_warnsent',{rid:id,id:W.id,k}).catch(()=>{});(W.sent=W.sent||{})[k]=GSX.host.today()}}
function warnOpen(id){const r=rid(id);if(!r)return;if(!can('warn'))return toast('توجيه الإنذارات غير متاح حالياً');
 const run=pr=>GSX.warn({...warnCtx(r),mode:'new',prior:pr,save:async d=>(await api('sup_warn',{rid:id,...d})).w,saved:W=>{(WN[id]=WN[id]||[]).unshift(W);route(1)},sent:warnSentFn(id)});
 if(Array.isArray(WN[id]))run(WN[id]);else api('sup_warns',{rid:id}).then(j=>{WN[id]=j.warnings||[];run(WN[id])}).catch(e=>toast(e.message))}
